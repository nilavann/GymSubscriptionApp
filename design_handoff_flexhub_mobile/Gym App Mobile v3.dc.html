<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
  body{margin:0;background:#e9eaee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Nunito,sans-serif}
  a{color:#6b7280;text-decoration:none}
  a:hover{color:#111827}
</style>
</helmet>

<div style="padding:32px 36px 48px">
  <div style="margin-bottom:22px">
    <div style="font-size:20px;font-weight:700;color:#111827">Fit &amp; Fine Gym · Mobile (v3 theme)</div>
    <div style="font-size:13px;color:#6b7280;margin-top:4px">Same components as desktop, laid out for a 390px phone. Each frame is live — tap through it.</div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:36px 28px;align-items:flex-start">
    <sc-for list="{{ screens }}" as="s" hint-placeholder-count="9">
      <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
        <div style="font-size:13px;font-weight:600;color:#374151">{{ s.label }}</div>
        <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="390px,844px">
          <iframe src="{{ s.src }}" title="{{ s.label }}" style="display:block;width:100%;height:100%;border:none;background:#f3f4f6"></iframe>
        </x-import>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ["login", "Login"], ["membersCopy", "Members"], ["action", "Action Center"], ["detail", "Member Detail"],
      ["renew", "Renew / Add Subscription"], ["add", "Add Member"], ["edit", "Edit Member"], ["reports", "Reports"], ["admin", "Settings"],
    ];
    return { screens: list.map(([id, label]) => ({ label, src: `Gym App Mockups v3.dc.html?screen=${id}&embed=1` })) };
  }
}

</script>
</body>
</html>
